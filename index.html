<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>荣光之影 · 牌桌</title>
<meta name="description" content="《In the Shadow of Glory 荣光之影》双人书信游戏的离线辅助工具：抽牌查表、角色卡记录、信纸写信与导出。">
<style>
:root{
  --felt:#16262b;
  --felt-deep:#0e1a1e;
  --felt-up:#1d3138;
  --hair:rgba(239,231,214,.14);
  --hair-strong:rgba(239,231,214,.28);
  --paper:#efe7d6;
  --paper-2:#e3d8c1;
  --ink:#1c1a17;
  --ink-soft:#54504a;
  --crimson:#8e1f28;
  --crimson-lit:#c2505a;
  --brass:#c08a3e;
  --mist:#9db0b3;
  --serif:"Songti SC","SimSun","Source Han Serif SC","Noto Serif CJK SC","STSong",Georgia,serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
  --rail:150px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--felt);
  background-image:
    radial-gradient(120% 80% at 50% -10%, rgba(192,138,62,.10), transparent 60%),
    radial-gradient(100% 70% at 50% 110%, rgba(0,0,0,.45), transparent 55%);
  background-attachment:fixed;
  color:#e8e0d0;
  font-family:var(--sans);
  font-size:15px;
  line-height:1.75;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.35;margin:0}
p{margin:0 0 .8em}
a{color:var(--brass)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- 骨架 ---------- */
.app{display:flex;min-height:100vh}
.rail{
  width:var(--rail);flex:none;position:sticky;top:0;height:100vh;
  border-right:1px solid var(--hair);
  background:linear-gradient(180deg,var(--felt-deep),rgba(14,26,30,.4));
  display:flex;flex-direction:column;padding:22px 0 14px;
}
.brand{padding:0 18px 20px;border-bottom:1px solid var(--hair);margin-bottom:14px}
.brand b{display:block;font-family:var(--serif);font-size:21px;letter-spacing:.06em;color:var(--paper)}
.brand span{display:block;font-size:10.5px;color:var(--mist);letter-spacing:.16em;margin-top:4px;font-family:var(--mono)}
.rail nav{display:flex;flex-direction:column;gap:1px;flex:1}
.rail nav button{
  background:none;border:0;text-align:left;padding:9px 18px;cursor:pointer;
  color:var(--mist);font-size:14.5px;letter-spacing:.05em;position:relative;
}
.rail nav button:hover{color:var(--paper)}
.rail nav button[aria-current="true"]{color:var(--paper);background:rgba(239,231,214,.06)}
.rail nav button[aria-current="true"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--crimson-lit)}
.rail nav button .suit{color:var(--mist);margin-right:7px;font-size:12px}
.rail nav button .suit.r{color:var(--crimson-lit)}
.rail nav button[aria-current="true"] .suit,.rail nav button[aria-current="true"] .suit.r{color:var(--brass)}
.railfoot{padding:12px 18px 0;font-size:11px;color:var(--mist);border-top:1px solid var(--hair);line-height:1.6}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.statusbar{
  position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;
  padding:10px 26px;border-bottom:1px solid var(--hair);
  background:rgba(14,26,30,.93);backdrop-filter:blur(8px);font-size:13px;
}
.stat{display:flex;align-items:center;gap:7px;color:var(--mist)}
.stat b{color:var(--paper);font-weight:600}
.pips{display:inline-flex;gap:3px}
.pip{width:9px;height:9px;border:1px solid var(--hair-strong);border-radius:50%}
.pip.on{background:var(--crimson-lit);border-color:var(--crimson-lit)}
.pip.warn{background:var(--brass);border-color:var(--brass)}
.statusbar .spacer{flex:1}
.wrap{padding:30px 26px 90px;max-width:1010px;width:100%;margin:0 auto}

/* ---------- 通用块 ---------- */
.sheet{
  background:rgba(239,231,214,.045);
  border:1px solid var(--hair);
  padding:22px 24px;margin-bottom:22px;
}
.sheet > h2{font-size:22px;color:var(--paper);margin-bottom:4px}
.sheet > h2 .sub{font-family:var(--sans);font-size:12px;color:var(--mist);margin-left:10px;letter-spacing:.08em}
.sheet > .lede{color:var(--mist);font-size:13.5px;margin:6px 0 18px;max-width:66ch}
h3.mini{font-size:15px;color:var(--paper);margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--hair)}
h3.mini:first-child{margin-top:0}
.muted{color:var(--mist)}
.small{font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}

button.btn{
  background:rgba(239,231,214,.07);border:1px solid var(--hair-strong);color:var(--paper);
  padding:7px 14px;cursor:pointer;font-size:13.5px;letter-spacing:.04em;border-radius:2px;
  transition:background .15s,border-color .15s;
}
button.btn:hover{background:rgba(239,231,214,.14)}
button.btn.primary{background:var(--crimson);border-color:var(--crimson);color:#f6ece0}
button.btn.primary:hover{background:#a5262f}
button.btn.ghost{background:none;color:var(--mist)}
button.btn.ghost:hover{color:var(--paper)}
button.btn.tiny{padding:3px 8px;font-size:12px}
button.btn.fx{border-color:rgba(192,138,62,.55);color:var(--brass);background:rgba(192,138,62,.08)}
button.btn.fx:hover{background:rgba(192,138,62,.18);color:#efdcb8}
button.btn:disabled{opacity:.35;cursor:not-allowed}

label.field{display:block;margin-bottom:12px}
label.field > span{display:block;font-size:12px;color:var(--mist);margin-bottom:4px;letter-spacing:.08em}
input[type=text],input[type=number],select,textarea{
  width:100%;background:rgba(0,0,0,.22);border:1px solid var(--hair);color:var(--paper);
  padding:8px 10px;border-radius:2px;font-family:var(--sans);
}
textarea{resize:vertical;line-height:1.8}
input[type=text]:hover,textarea:hover,select:hover{border-color:var(--hair-strong)}

.tag{display:inline-block;border:1px solid var(--hair-strong);padding:2px 9px;font-size:12px;color:var(--paper);border-radius:2px}
.tag.red{color:var(--crimson-lit);border-color:rgba(194,80,90,.5)}
.tag.gold{color:var(--brass);border-color:rgba(192,138,62,.45)}

.notice{border-left:3px solid var(--brass);background:rgba(192,138,62,.08);padding:12px 16px;margin:14px 0;font-size:13.5px}
.notice.danger{border-left-color:var(--crimson-lit);background:rgba(194,80,90,.10)}

/* ---------- 扑克牌 ---------- */
.cardface{
  width:130px;aspect-ratio:5/7;background:var(--paper);color:var(--ink);
  border-radius:7px;position:relative;flex:none;
  box-shadow:0 10px 26px rgba(0,0,0,.45), inset 0 0 0 1px rgba(28,26,23,.14);
  font-family:var(--serif);user-select:none;
}
.cardface.red{color:var(--crimson)}
.cardface .ix{position:absolute;line-height:1;text-align:center}
.cardface .ix .r{font-size:19px;font-weight:600;display:block}
.cardface .ix .s{font-size:14px;display:block;margin-top:1px}
.cardface .ix.tl{top:8px;left:9px}
.cardface .ix.br{bottom:8px;right:9px;transform:rotate(180deg)}
.cardface .center{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;opacity:.92}
.cardface.joker .center{font-size:20px;letter-spacing:.3em;writing-mode:vertical-rl}
.cardface.back{
  background:
    repeating-linear-gradient(45deg,#7d2029 0 6px,#6b1a23 6px 12px);
  box-shadow:0 10px 26px rgba(0,0,0,.45), inset 0 0 0 6px var(--paper), inset 0 0 0 7px rgba(28,26,23,.2);
}
.cardface.sm{width:86px}
.cardface.sm .ix .r{font-size:14px}
.cardface.sm .ix .s{font-size:11px}
.cardface.sm .center{font-size:30px}

.flipwrap{perspective:900px;width:130px;flex:none}
.flipwrap .cardface{animation:deal .45s cubic-bezier(.2,.75,.3,1)}
@keyframes deal{from{transform:rotateY(85deg) translateY(-8px);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flipwrap .cardface{animation:none}}

.draw{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.draw .result{flex:1;min-width:240px}
.draw .result .headline{font-family:var(--serif);font-size:20px;color:var(--paper);margin-bottom:6px}
.draw .result .body{color:#d8cfbe;max-width:60ch}

/* ---------- 角色卡 ---------- */
.dossier{background:rgba(239,231,214,.05);border:1px solid var(--hair);padding:0}
.dossier .head{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:18px 22px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.dossier .head h2{font-size:26px;color:var(--paper)}
.dossier .head h2 small{font-family:var(--sans);font-size:13px;color:var(--mist);margin-left:8px}
.dossier .body{padding:18px 22px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 14px;align-items:baseline;margin-bottom:14px}
.kv dt{color:var(--mist);font-size:12.5px;letter-spacing:.08em}
.kv dd{margin:0;color:var(--paper)}

.goal{border:1px solid var(--hair);padding:10px 12px;margin-bottom:9px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.goal .txt{flex:1;min-width:150px}
.goal .txt em{font-style:normal;font-size:11.5px;color:var(--mist);display:block;letter-spacing:.08em}
.boxes{display:flex;gap:5px}
.boxes i{width:15px;height:15px;border:1px solid var(--hair-strong);display:inline-block;cursor:pointer;position:relative}
.boxes i.on{background:var(--brass);border-color:var(--brass)}
.goal.done{border-color:rgba(192,138,62,.5)}
.listline{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--hair)}
.listline:last-child{border-bottom:0}
.listline .grow{flex:1}
.scarline{color:#e3c9c0}

/* ---------- 写信 ---------- */
.papergrid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.swatch{border:1px solid var(--hair-strong);padding:5px 11px;cursor:pointer;font-size:12.5px;border-radius:2px;background:none;color:var(--mist)}
.swatch[aria-pressed="true"]{border-color:var(--brass);color:var(--paper);background:rgba(192,138,62,.12)}
.letterstage{background:rgba(0,0,0,.2);padding:20px;border:1px solid var(--hair);overflow:auto}
.letter{
  width:100%;max-width:720px;margin:0 auto;min-height:420px;padding:52px 56px;
  background:var(--lp-bg,#ece2cd);color:var(--lp-ink,#33291d);position:relative;
  box-shadow:0 18px 40px rgba(0,0,0,.4);font-family:var(--serif);font-size:16px;line-height:2.05;
}
.letter.f-sans{font-family:var(--sans)}
.letter.f-mono{font-family:var(--mono);font-size:14.5px;line-height:1.95}
.letter .lt-to{font-size:17px;margin-bottom:18px;color:var(--lp-accent,#8e1f28)}
.letter .lt-body{white-space:pre-wrap;word-break:break-word}
.letter .lt-sign{margin-top:26px;text-align:right;color:var(--lp-accent,#8e1f28)}
.letter .lt-meta{position:absolute;top:20px;right:26px;font-size:11px;opacity:.55;font-family:var(--sans);letter-spacing:.1em}
.letter.r-lines .lt-body{
  background-image:repeating-linear-gradient(transparent 0 31px, rgba(0,0,0,.13) 31px 32px);
  background-attachment:local;line-height:32px;
}
.letter.r-grid .lt-body{
  background-image:repeating-linear-gradient(transparent 0 31px, rgba(0,0,0,.10) 31px 32px),
                   repeating-linear-gradient(90deg,transparent 0 31px, rgba(0,0,0,.07) 31px 32px);
  background-attachment:local;line-height:32px;
}
.letter.d-margin::before{content:"";position:absolute;left:38px;top:0;bottom:0;width:1px;background:rgba(140,40,40,.35)}
.letter.d-edge{box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08)}
.letter.d-perf{border-top:2px dashed rgba(0,0,0,.25);border-bottom:2px dashed rgba(0,0,0,.25)}
.letter.d-seal .lt-head{border-bottom:2px solid var(--lp-accent);padding-bottom:8px;margin-bottom:20px;font-size:13px;letter-spacing:.3em;font-family:var(--sans)}
.letter.d-masthead .lt-head{border-top:3px double currentColor;border-bottom:3px double currentColor;padding:6px 0;margin-bottom:22px;text-align:center;font-size:13px;letter-spacing:.5em}
.letter.d-stain::after{content:"";position:absolute;left:38px;bottom:34px;width:88px;height:88px;border-radius:50%;
  border:3px solid rgba(126,86,38,.10);box-shadow:inset 0 0 14px rgba(126,86,38,.05);pointer-events:none}
.letter.d-seal::before{content:"";position:absolute;left:0;right:0;top:26px;height:2px;background:var(--lp-accent);opacity:.75}
.letter.d-masthead::before{content:"";position:absolute;left:34px;right:34px;top:24px;height:5px;
  border-top:2px solid currentColor;border-bottom:1px solid currentColor;opacity:.75}
.letter.d-masthead::after{content:"";position:absolute;left:34px;right:34px;bottom:24px;height:3px;
  border-top:1px solid currentColor;opacity:.5}
.letter.d-perf::before{content:"";position:absolute;left:0;right:0;top:14px;border-top:1px dashed rgba(0,0,0,.3)}

.mailrow{display:flex;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--hair);cursor:pointer}
.mailrow:hover{background:rgba(239,231,214,.04)}
.mailrow .wk{font-family:var(--mono);font-size:12px;color:var(--brass);flex:none;width:64px}
.mailrow .ex{flex:1;color:var(--mist);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 查表 ---------- */
table.lookup{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:6px}
table.lookup th,table.lookup td{border-bottom:1px solid var(--hair);padding:6px 10px;text-align:left;vertical-align:top}
table.lookup th{color:var(--mist);font-weight:500;font-size:12px;letter-spacing:.1em}
table.lookup td.rk{font-family:var(--serif);color:var(--brass);width:44px}
table.lookup td.blk{color:#ded5c3}
table.lookup td.red{color:var(--crimson-lit)}
details.evt{border:1px solid var(--hair);margin-bottom:8px}
details.evt>summary{padding:8px 12px;cursor:pointer;color:var(--paper);font-family:var(--serif);font-size:15px}
details.evt>summary::marker{color:var(--brass)}
details.evt ol{margin:0;padding:0 18px 12px 34px;color:#d4cbba;font-size:13.5px}
details.evt li{margin-bottom:6px}
details.evt b{color:var(--brass);font-weight:600}

/* ---------- 日志 ---------- */
.weekcard{border:1px solid var(--hair);padding:14px 16px;margin-bottom:12px}
.weekcard h4{color:var(--paper);font-size:16px;margin-bottom:8px}
.weekcard .line{font-size:13.5px;color:#d0c8b8;margin-bottom:3px}
.weekcard .line b{color:var(--brass);font-weight:500;font-family:var(--mono);font-size:12px;margin-right:8px}

/* ---------- 弹层 ---------- */
.modal{position:fixed;inset:0;background:rgba(6,12,14,.82);z-index:100;display:grid;place-items:center;padding:20px}
.modal .box{background:var(--felt-up);border:1px solid var(--hair-strong);max-width:560px;width:100%;max-height:84vh;overflow:auto;padding:22px 24px}
.modal h3{font-size:19px;color:var(--paper);margin-bottom:10px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:12px 0}
.pickgrid button{text-align:left;background:rgba(0,0,0,.2);border:1px solid var(--hair);color:#ded5c3;padding:7px 10px;cursor:pointer;font-size:13px}
.pickgrid button:hover{border-color:var(--brass);color:var(--paper)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--paper);color:var(--ink);
  padding:9px 18px;border-radius:2px;z-index:200;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.5)}

/* ---------- 手机 ---------- */
@media (max-width:840px){
  .app{flex-direction:column}
  .rail{width:100%;height:auto;position:sticky;top:0;z-index:30;padding:12px 0 0;border-right:0;border-bottom:1px solid var(--hair)}
  .brand{padding:0 16px 10px;margin-bottom:8px}
  .brand b{font-size:18px}
  .rail nav{flex-direction:row;overflow-x:auto;gap:0;padding:0 8px;scrollbar-width:none}
  .rail nav::-webkit-scrollbar{display:none}
  .rail nav button{white-space:nowrap;padding:8px 12px;font-size:14px}
  .rail nav button[aria-current="true"]::before{left:12px;right:12px;top:auto;bottom:2px;width:auto;height:2px}
  .railfoot{display:none}
  .statusbar{position:static;padding:8px 14px;font-size:12.5px;gap:6px 14px;border-top:1px solid var(--hair)}
  .wrap{padding:18px 14px 70px}
  .sheet{padding:16px 14px}
  .letter{padding:32px 26px;font-size:15px}
  .kv{grid-template-columns:76px 1fr}
}

/* ---------- 打印 ---------- */
#printarea{display:none}
@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff;color:#000}
  body.printing .app{display:none}
  body.printing #printarea{display:block}
  .psheet{display:flex;flex-wrap:wrap;gap:0;page-break-after:always;align-content:flex-start}
  .pcard{
    width:63mm;height:88mm;border:.3pt solid #bbb;position:relative;
    font-family:var(--serif);color:#111;overflow:hidden;
  }
  .pcard.red{color:#9b1f28}
  .pcard .ix{position:absolute;line-height:1;text-align:center}
  .pcard .ix .r{font-size:15pt;font-weight:600;display:block}
  .pcard .ix .s{font-size:11pt;display:block}
  .pcard .ix.tl{top:5mm;left:5mm}
  .pcard .ix.br{bottom:7mm;right:5mm;transform:rotate(180deg)}
  .pcard .center{position:absolute;inset:0;display:grid;place-items:center;font-size:42pt}
  .pcard .foot{position:absolute;bottom:2mm;left:0;right:0;text-align:center;font-size:4.6pt;letter-spacing:.34em;color:#aaa}
  .pcard.back{background:repeating-linear-gradient(45deg,#8e1f28 0 2mm,#7a1a23 2mm 4mm);border:0;box-shadow:inset 0 0 0 3mm #fff,inset 0 0 0 3.2mm #ccc}
  .refcard{width:100%;height:138mm;border-bottom:.3pt dashed #999;padding:5mm 6mm;page-break-inside:avoid;
    font-family:var(--serif);color:#111;font-size:7.4pt;line-height:1.5;position:relative;overflow:hidden}
  .refcard h4{font-size:13pt;margin:0 0 2mm;border-bottom:.5pt solid #000;padding-bottom:1mm;display:flex;justify-content:space-between}
  .refcard h4 span{font-size:7pt;font-weight:400;color:#666;letter-spacing:.2em}
  .refcard .cols{column-count:2;column-gap:6mm}
  .refcard dl{margin:0 0 1.6mm;break-inside:avoid}
  .refcard dt{font-size:6.4pt;color:#8e1f28;letter-spacing:.12em;margin-bottom:.3mm}
  .refcard dd{margin:0}
  .refcard dd .b::before{content:"♠ ";color:#111}
  .refcard dd .r{color:#9b1f28;display:block}
  .refcard dd .r::before{content:"♥ "}
  .refcard .ev{break-inside:avoid;margin-bottom:1.6mm}
  .refcard .ev b{color:#8e1f28}
  .refcard ol{margin:0;padding-left:4mm}
  body.printing-letter .app{display:none}
  body.printing-letter #printarea{display:block}
  .printletter{width:100%;min-height:270mm;padding:18mm 20mm;font-family:var(--serif);font-size:11pt;line-height:2;
    background:var(--lp-bg);color:var(--lp-ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .printletter .lt-body{white-space:pre-wrap}
  .printletter .lt-to{margin-bottom:8mm;color:var(--lp-accent)}
  .printletter .lt-sign{margin-top:10mm;text-align:right;color:var(--lp-accent)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <b>荣光之影</b>
      <span>IN THE SHADOW OF GLORY</span>
    </div>
    <nav id="nav"></nav>
    <div class="railfoot">
      原作 Jessie Lee &amp; Brandon Lee<br>CC BY 4.0 · 离线辅助工具
    </div>
  </aside>

  <div class="main">
    <div class="statusbar" id="statusbar"></div>
    <div class="wrap">
      <section class="panel" id="p-setup"></section>
      <section class="panel" id="p-char"></section>
      <section class="panel" id="p-turn"></section>
      <section class="panel" id="p-write"></section>
      <section class="panel" id="p-mail"></section>
      <section class="panel" id="p-tables"></section>
      <section class="panel" id="p-cards"></section>
      <section class="panel" id="p-about"></section>
    </div>
  </div>
</div>

<div id="modalhost"></div>
<div id="printarea"></div>
<script>
/* ==========================================================================
   《荣光之影 In the Shadow of Glory》资料表
   原作：Jessie Lee & Brandon Lee — CC BY 4.0

let memoryFallback = null;

const store = {
  read(){

  },
  write(v){

};

function save(){ store.write(JSON.stringify(S)); }
function load(){
  const raw = store.read();
  if(!raw) return false;
  try{

    if(o && o.v === 1){ S = Object.assign(freshState(), o); return true; }
  }catch(e){}

}

/* ---------- 小工具 ---------- */
const $ = sel => document.querySelector(sel);
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}
function bold(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }

/* ---------- 牌堆 ---------- */
function buildDeck(){
  const d = [];
  for(const su of SUITS) for(const r of RANKS) d.push({r, s:su.s, c:su.c});
  d.push({r:'王', s:'★', c:'joker'});
  d.push({r:'王', s:'☆', c:'joker'});
  return shuffle(d);
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function ensureDeck(){ if(!S.deck.length && !S.discard.length && !S.hand.length) S.deck = buildDeck(); }
function drawCard(){
  ensureDeck();
  if(!S.deck.length){ S.deckEmpty = true; checkRetire(); return null; }
  const c = S.deck.pop();
  S.discard.push(c);
  if(!S.deck.length){ S.deckEmpty = true; checkRetire(); }
  return c;
}
function reshuffleAll(){
  S.deck = shuffle(S.deck.concat(S.discard, S.hand));
  S.discard = []; S.hand = []; S.deckEmpty = false;
  save(); render(); toast('牌堆已重洗');
}
function cardLabel(c){ return c ? (c.c==='joker' ? '鬼牌' : c.s + c.r) : '—'; }
function isRed(c){ return c && c.c === 'red'; }

function cardHTML(c, cls){
  if(!c) return '';
  const k = ['cardface', c.c==='red'?'red':'', c.c==='joker'?'joker':'', cls||''].join(' ');
  if(c.c === 'joker')
    return `<div class="${k}"><div class="ix tl"><span class="r">王</span></div>
      <div class="center">JOKER</div><div class="ix br"><span class="r">王</span></div></div>`;
  return `<div class="${k}">
    <div class="ix tl"><span class="r">${c.r}</span><span class="s">${c.s}</span></div>
    <div class="center">${c.s}</div>
    <div class="ix br"><span class="r">${c.r}</span><span class="s">${c.s}</span></div></div>`;
}
function dealHTML(c){ return `<div class="flipwrap">${cardHTML(c)}</div>`; }

/* 查表：dual 表按红黑取值 */
function lookup(key, c){
  const meta = TABLE_META.find(m=>m.key===key);
  const data = meta ? meta.data : (key==='daily'?T.daily:T.super);
  if(meta) return meta.dual ? data[c.r][isRed(c)?1:0] : data[c.r];
  return null;
}

/* ---------- 退场判定 ---------- */
function retireReason(){
  if(S.me.scars.length >= 4) return '伤痕累积到 4 道，角色被创伤压垮。';
  if(S.me.risk >= 4) return '风险值达到 4，秘密身份暴露。';
  if(S.me.goals.length && S.me.goals.every(g=>g.filled>=g.boxes)) return '所有目标均已完成，角色失去方向。';
  if(S.deckEmpty) return '牌堆用尽，太多时间过去，角色已苍老疲惫。';
  if(S.retireCountdown === 0) return '提示指定的倒计时已到。';
  return null;
}
function checkRetire(){
  if(S.retired) return;
  const r = retireReason();
  if(r){ S.retired = {reason:r, week:S.week}; save(); }
}

/* 从一张表里手动挑选 */
function pickFromTable(key, cb){
  const meta = TABLE_META.find(m=>m.key===key);
  let html = '<div class="pickgrid">';
  for(const r of RANKS){
    if(meta.dual){
      html += `<button data-pick="${esc(meta.data[r][0])}">${r} ♠ ${esc(meta.data[r][0])}</button>`;
      html += `<button data-pick="${esc(meta.data[r][1])}" style="color:var(--crimson-lit)">${r} ♥ ${esc(meta.data[r][1])}</button>`;
    }else{
      html += `<button data-pick="${esc(meta.data[r])}">${r} · ${esc(meta.data[r])}</button>`;
    }
  }
  html += '</div>';
  modal('从「'+meta.name+'」中挑选', html);
  $('#modalhost').querySelectorAll('[data-pick]').forEach(b=>{
    b.onclick = () => { closeModal(); cb(b.getAttribute('data-pick')); };
  });
}

/* ---------- 事件绑定 ---------- */
const ACT = {};
function bind(root){
  root.querySelectorAll('[data-act]').forEach(el=>{
    if(el.__bound) return; el.__bound = true;
    const ev = (el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT')
      ? (el.type==='checkbox'||el.tagName==='SELECT' ? 'change' : 'input') : 'click';
    el.addEventListener(ev, e => {
      const fn = ACT[el.getAttribute('data-act')];
      if(fn){ fn(el, e); }
    });
  });
}

        <input type="text" data-act="setLength" value="${esc(S.fmt.length)}" placeholder="几句话 / 一两百字 / 一页"></label>

    <p class="small muted">两边都尽量守住这个长度，体验才公平。也可以现在就商定游戏时长，或者一直玩到某位角色退场。</p>

    <h3 class="mini">你们之间的关系</h3>
    <div class="draw">
      ${rel ? dealHTML(rel.card) : '<div class="flipwrap"><div class="cardface back"></div></div>'}

          <button class="btn ghost" data-act="pickRel">直接挑选</button>

function setSimple(field, key, tableKey, useCard){
  const c = useCard ? drawCard() : null;
  if(useCard && !c){ toast('牌堆空了'); return; }
  if(useCard && c.c==='joker'){
    pickFromTable(tableKey, txt => { S[field] = {card:c, text:txt, note:(S[field]||{}).note||''}; save(); render(); });
    return;
  }
  S[field] = {card:c, text: c ? lookup(tableKey,c) : '', note:(S[field]||{}).note||''};
  save(); render();
}

ACT.drawRule  = () => setSimple('powerRule','powerRule','powerRule',true);
ACT.drawRel   = () => setSimple('relationship','relationship','relationship',true);

ACT.pickRule  = () => pickFromTable('powerRule', t => { S.powerRule = {card:null,text:t,note:(S.powerRule||{}).note||''}; save(); render(); });
ACT.pickRel   = () => pickFromTable('relationship', t => { S.relationship = {card:null,text:t}; save(); render(); });
ACT.setWorldNote = el => { S.world.note = el.value; save(); };
ACT.setRuleNote  = el => { S.powerRule.note = el.value; save(); };

ACT.setLength = el => { S.fmt.length = el.value; save(); };

const ASSIGN = [
  {key:'power', label:'超能力',   table:'power',       get:()=>S.me.powers.join(' / ')},
  {key:'front', label:'掩护身份', table:'front',       get:()=>S.me.front},
  {key:'lair',  label:'据点',     table:'lair',        get:()=>S.me.lair},
  {key:'poi',   label:'关键人物', table:'poi',         get:()=>S.me.pois.map(p=>p.role+(p.name?`（${p.name}）`:'')).join('、')},
  {key:'mg',    label:'日常目标', table:'mundaneGoal', get:()=>(S.me.goals.find(g=>g.kind==='日常')||{}).text||''},
  {key:'sg',    label:'超能力目标',table:'superGoal',  get:()=>(S.me.goals.find(g=>g.kind==='超能力')||{}).text||''},
  {key:'feel',  label:'隐藏情感', table:'feeling',     get:()=>S.me.feeling}
];

function applyAssign(key, text){
  const m = S.me;
  if(key==='power'){ m.powers = [text]; }
  if(key==='front'){ m.front = text; }
  if(key==='lair'){ m.lair = text; }
  if(key==='poi'){ m.pois.push({role:text, name:''}); }
  if(key==='mg'){ const g = m.goals.find(g=>g.kind==='日常'); if(g){g.text=text;} else m.goals.push(newGoal(text,'日常')); }
  if(key==='sg'){ const g = m.goals.find(g=>g.kind==='超能力'); if(g){g.text=text;} else m.goals.push(newGoal(text,'超能力')); }
  if(key==='feel'){ m.feeling = text; }
  save(); render();
}
function newGoal(text, kind){ return {text, kind:kind||'新', boxes:3, filled:0}; }

ACT.dealHand = () => {
  ensureDeck();
  S.deck = shuffle(S.deck.concat(S.discard, S.hand)); S.discard = []; S.hand = [];
  S.hand = S.deck.splice(-8, 8); save(); render();
};
ACT.assign = el => {
  const key = el.getAttribute('data-arg');
  if(!S.hand.length){ toast('先抽 8 张手牌'); return; }
  const a = ASSIGN.find(x=>x.key===key);
  const meta = TABLE_META.find(m=>m.key===a.table);
  const html = `<p class="small muted">从手牌里弃掉一张，查「${meta.name}」表。</p>
    <div class="row" style="gap:6px">${S.hand.map((c,i)=>{
      const v = c.c==='joker' ? '鬼牌（任选）' : (meta.dual ? meta.data[c.r][isRed(c)?1:0] : meta.data[c.r]);
      return `<button data-idx="${i}" style="background:none;border:0;padding:0;cursor:pointer;text-align:center;width:86px">
        ${cardHTML(c,'sm')}<div class="small" style="margin-top:4px;color:var(--mist);line-height:1.4">${esc(v)}</div></button>`;
    }).join('')}</div>`;
  modal('指派手牌 · '+a.label, html);
  $('#modalhost').querySelectorAll('[data-idx]').forEach(b=>{
    b.onclick = () => {
      const i = +b.getAttribute('data-idx');
      const c = S.hand.splice(i,1)[0];
      S.discard.push(c);
      closeModal();
      if(c.c==='joker'){ pickFromTable(a.table, t=>applyAssign(key,t)); }
      else applyAssign(key, meta.dual ? meta.data[c.r][isRed(c)?1:0] : meta.data[c.r]);
    };
  });
};
ACT.assignPick = el => {
  const key = el.getAttribute('data-arg');
  const a = ASSIGN.find(x=>x.key===key);
  pickFromTable(a.table, t => applyAssign(key, t));
};
ACT.useHand = () => toast('点某一行右侧的「指派手牌」来使用它');
ACT.firstScar = el => {
  const v = el.value.trim();
  if(!S.me.scars.length){ if(v) S.me.scars.push({text:v, week:S.week}); }
  else if(v) S.me.scars[0].text = v; else S.me.scars.shift();
  save(); renderStatus();
};
ACT.scarIGave = el => { S.foe.scarIGave = el.value; save(); };
ACT.drawSide = () => {
  const c = drawCard(); if(!c){ toast('牌堆空了'); return; }
  S.side = (c.c==='black') ? '英雄' : (c.c==='red' ? '反派' : '由你选择');
  save(); render();
  toast(`翻出 ${cardLabel(c)} → ${S.side}`);
};
ACT.setSide = el => { S.side = el.getAttribute('data-arg'); save(); render(); };
ACT.finishCreate = () => {
  S.phase = 'play';
  S.deck = shuffle(S.deck.concat(S.discard, S.hand));

  save(); tab = 'write'; render();

ACT.setCivil = el => { S.me.civil = el.value; save(); };
ACT.setLook = el => { S.me.look = el.value; save(); };
ACT.setFoe = el => { S.foe.name = el.value; save(); };

   ========================================================================== */
function promptIndexFor(kind, rank){
  const n = S.seen[kind][rank] || 0;
  return Math.min(n, 3);
}
function drawEvent(kind){
  const c = drawCard(); if(!c){ toast('牌堆空了'); return; }
  const finish = rank => {
    const idx = promptIndexFor(kind, rank);
    S.seen[kind][rank] = (S.seen[kind][rank]||0) + 1;
    const tbl = kind==='daily' ? T.daily : T.super;
    S.current[kind==='daily'?'daily':'sup'] = {card:c, rank, idx, t:tbl[rank].t, x:tbl[rank].p[idx].x, fx:tbl[rank].p[idx].fx||[], note:''};
    save(); render();
  };
  if(c.c==='joker'){
    const html = '<p class="small muted">鬼牌是万能牌：从这张表里任选一个条目。</p><div class="pickgrid">' +
      RANKS.map(r=>`<button data-r="${r}">${r} · ${(kind==='daily'?T.daily:T.super)[r].t}</button>`).join('') + '</div>';
    modal('鬼牌 · 任选一项', html);
    $('#modalhost').querySelectorAll('[data-r]').forEach(b=>{
      b.onclick = () => { closeModal(); finish(b.getAttribute('data-r')); };
    });
    return;
  }
  finish(c.r);
}
ACT.drawMood = () => {
  const c = drawCard(); if(!c){ toast('牌堆空了'); return; }
  if(c.c==='joker'){ pickFromTable('mood', t => { S.current.mood = {card:c, text:t}; save(); render(); }); return; }
  S.current.mood = {card:c, text:lookup('mood',c)}; save(); render();
};
ACT.drawDaily = () => drawEvent('daily');
ACT.drawSuper = () => drawEvent('super');
ACT.redrawEvent = el => { const k = el.getAttribute('data-arg');
  if(k==='daily'){ const cur=S.current.daily; if(cur) S.seen.daily[cur.rank]--; S.current.daily=null; }
  else { const cur=S.current.sup; if(cur) S.seen.super[cur.rank]--; S.current.sup=null; }
  save(); render();
};
ACT.evtNote = el => {
  const k = el.getAttribute('data-arg');
  (k==='daily'?S.current.daily:S.current.sup).note = el.value; save();
};

function eventBlock(kind){
  const cur = kind==='daily' ? S.current.daily : S.current.sup;
  const title = kind==='daily' ? '日常事件' : '超能力事件';
  const hint = kind==='daily'
    ? '生活里的琐碎时刻——不是改变世界的大事，而是以微妙而人性的方式影响你的角色。'
    : '世界上更大规模的事情。有时直接关系到你，有时只是从远处影响你。';
  if(!cur) return `
    <h3 class="mini">${title}</h3>
    <div class="draw">
      <div class="flipwrap"><div class="cardface back"></div></div>
      <div class="result"><p class="body small muted">${hint}</p>
      <button class="btn" data-act="${kind==='daily'?'drawDaily':'drawSuper'}">抽一张</button></div>
    </div>`;

ACT.advance = () => {
  const i = +$('#goalsel').value; const g = S.me.goals[i];
  if(!g) return;
  if(g.filled >= g.boxes){ toast('这个目标已经完成了'); return; }
  g.filled++; S.current.advanced = true; save(); checkRetire(); render();
};
ACT.endWeek = () => {
  const c = S.current;
  S.weeklog.push({
    week:S.week,
    mood:c.mood?c.mood.text:'',
    daily:c.daily?{t:c.daily.t, i:c.daily.idx+1, x:c.daily.x, note:c.daily.note}:null,
    sup:c.sup?{t:c.sup.t, i:c.sup.idx+1, x:c.sup.x, note:c.sup.note}:null,
    advanced:c.advanced
  });
  S.week++;
  S.current = {mood:null, daily:null, sup:null, advanced:false};
  if(S.retireCountdown !== null && S.retireCountdown !== undefined){
    S.retireCountdown--;
    if(S.retireCountdown <= 0){ S.retireCountdown = 0; checkRetire(); }
  }
  save(); checkRetire(); render();
  toast('第 '+(S.week-1)+' 周已归入日志');
};

/* ---------- 提示的机制效果 ---------- */
function chooseFrom(title, items, cb){
  if(!items.length){ toast('没有可选的对象'); return; }
  modal(title, '<div class="pickgrid">' + items.map((t,i)=>`<button data-i="${i}">${esc(t)}</button>`).join('') + '</div>');
  $('#modalhost').querySelectorAll('[data-i]').forEach(b=>{
    b.onclick = () => { closeModal(); cb(+b.getAttribute('data-i')); };
  });
}
ACT.fx = el => {
  const [kind, i] = el.getAttribute('data-arg').split(':');
  const cur = kind==='daily' ? S.current.daily : S.current.sup;
  const f = cur.fx[+i];
  applyFx(f.op, f.arg);
};
function applyFx(op, arg){
  const m = S.me;
  switch(op){
    case 'scar+': ACT.addScar(); return;
    case 'scar-':
      chooseFrom('治愈哪一道伤痕？', m.scars.map(s=>s.text), i=>{ m.scars.splice(i,1); save(); render(); toast('伤痕已愈合'); });
      return;
    case 'risk+': m.risk++; break;
    case 'risk-': m.risk = Math.max(0, m.risk-1); break;
    case 'prog+':
      chooseFrom('为哪个目标标记进度？', m.goals.map(g=>`${g.text}（${g.filled}/${g.boxes}）`), i=>{
        const g = m.goals[i]; if(g.filled<g.boxes) g.filled++; save(); checkRetire(); render();
      }); return;
    case 'prog-':
      chooseFrom('擦除哪个目标的进度？', m.goals.map(g=>`${g.text}（${g.filled}/${g.boxes}）`), i=>{
        const g = m.goals[i];
        if(g.filled>0) g.filled--; else { g.boxes++; toast('没有已勾的方框，改为多画一个空框'); }
        save(); render();
      }); return;
    case 'poi+':
      modal('获得一位关键人物', '<p class="small muted">抽牌决定他是谁，或者直接写下来。</p>',
        `<button class="btn primary" data-act="fxPoiDraw">抽牌</button><button class="btn" data-act="fxPoiPick">从表里挑</button><button class="btn ghost" data-act="closemodal">取消</button>`);
      return;
    case 'poi-':
      chooseFrom('失去哪一位关键人物？', m.pois.map(p=>p.role+(p.name?`（${p.name}）`:'')), i=>{ m.pois.splice(i,1); save(); render(); });
      return;
    case 'goal+': m.goals.push(newGoal(arg, '新')); toast('已添加目标：'+arg); break;
    case 'mood+': ACT.drawMood(); return;
    case 'front-': {
      const c = drawCard(); if(!c){ toast('牌堆空了'); return; }
      if(c.c==='joker'){ pickFromTable('front', t=>{ m.front = t; save(); render(); }); return; }
      m.front = lookup('front', c); toast(`${cardLabel(c)} → 新掩护身份：${m.front}`); break;
    }
    case 'frontgoal-': {
      m.front = '';
      const gi = m.goals.findIndex(g=>g.kind==='日常');
      if(gi>=0) m.goals.splice(gi,1);
      toast('失去掩护身份与日常目标'); break;
    }
    case 'power+': {
      const c = drawCard(); if(!c){ toast('牌堆空了'); return; }
      if(c.c==='joker'){ pickFromTable('power', t=>{ m.powers.push(t); save(); render(); }); return; }
      m.powers.push(lookup('power', c)); toast(`${cardLabel(c)} → 新能力：${lookup('power',c)}`); break;
    }
    case 'power-':
      chooseFrom('失去哪一项超能力？', m.powers, i=>{ m.powers.splice(i,1); save(); render(); });
      return;
    case 'name-': m.hero = ''; toast('名字被擦除了'); break;
    case 'world+': {
      const c = drawCard(); if(!c){ toast('牌堆空了'); return; }
      if(c.c==='joker'){ pickFromTable('world', t=>{ S.world={card:null,text:t,note:(S.world||{}).note||''}; save(); render(); }); return; }
      S.world = {card:c, text:lookup('world',c), note:(S.world||{}).note||''};
      toast('世界变了：'+S.world.text); break;
    }
    case 'retire2': S.retireCountdown = 2; toast('2 个回合后退场'); break;
  }
  save(); checkRetire(); render();
}

ACT.fileLetter = () => {

ACT.copyLetter = () => {

function fallbackCopy(t){
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败，请手动选择'); }

function plainLetter(d){
  d = d || S.draft;
  const head = d.kind==='news' ? '【新闻报道】\n' : (d.kind==='obit' ? '【讣告】\n' : '');
  const to = (d.kind==='news'||d.kind==='obit') ? '' : ((d.to||S.foe.name||'')+'：\n\n');
  return head + to + d.body + '\n\n' + (d.from||S.me.hero||'');

function download(name, text, mime){
  const blob = new Blob([text], {type:(mime||'text/plain')+';charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* PNG 导出：直接画在 canvas 上，完全离线 */
ACT.exportPNG = () => {
  const d = S.draft, p = paperById(d.paper);
  const W = 1240, H = 1754, pad = 108;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.fillStyle = p.bg; g.fillRect(0,0,W,H);

  const serif = '"Songti SC","SimSun",Georgia,serif';
  const sans  = '"PingFang SC","Microsoft YaHei",sans-serif';
  const mono  = 'Menlo,Consolas,"Courier New",monospace';
  const fam = p.font==='mono' ? mono : (p.font==='sans' ? sans : serif);
  const lh = 46, fs = 25;

  if(p.rule==='lines' || p.rule==='grid'){
    g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = 1;
    for(let y=pad+lh; y<H-pad; y+=lh){ g.beginPath(); g.moveTo(pad,y+.5); g.lineTo(W-pad,y+.5); g.stroke(); }
    if(p.rule==='grid'){ g.strokeStyle='rgba(0,0,0,.07)';
      for(let x=pad; x<W-pad; x+=lh){ g.beginPath(); g.moveTo(x+.5,pad); g.lineTo(x+.5,H-pad); g.stroke(); } }
  }
  if(p.deco==='margin'){ g.strokeStyle='rgba(140,40,40,.4)'; g.beginPath(); g.moveTo(pad-26,0); g.lineTo(pad-26,H); g.stroke(); }
  if(p.deco==='perf'){ g.strokeStyle='rgba(0,0,0,.3)'; g.setLineDash([10,8]);
    [pad/2, H-pad/2].forEach(y=>{ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }); g.setLineDash([]); }
  if(p.deco==='edge'){ g.strokeStyle='rgba(255,255,255,.10)'; g.lineWidth=2; g.strokeRect(30,30,W-60,H-60); }

  let y = pad;
  g.textBaseline = 'top';
  g.fillStyle = p.accent;
  if(d.kind==='news' || d.kind==='obit'){
    g.font = `500 30px ${fam}`;
    const t = d.kind==='news' ? '本  市  新  闻' : '讣　　告';
    g.textAlign = 'center'; g.fillText(t, W/2, y);
    g.textAlign = 'left';
    g.strokeStyle = p.accent; g.lineWidth = 2;
    g.beginPath(); g.moveTo(pad, y+52); g.lineTo(W-pad, y+52); g.stroke();
    y += 96;
  }else{
    g.font = `500 28px ${fam}`;
    g.fillText((d.to||S.foe.name||'') + '：', pad, y);
    y += 66;
  }
  g.fillStyle = p.ink; g.font = `${fs}px ${fam}`;
  const maxW = W - pad*2;
  for(const para of String(d.body).split('\n')){
    if(!para){ y += lh*0.6; continue; }
    let line = '';
    for(const ch of para){
      if(g.measureText(line+ch).width > maxW){ g.fillText(line, pad, y); y += lh; line = ch; }
      else line += ch;
      if(y > H - pad - lh*3){ break; }
    }
    if(line) { g.fillText(line, pad, y); y += lh; }
    if(y > H - pad - lh*3){ g.fillText('……', pad, y); y += lh; break; }
  }
  g.fillStyle = p.accent; g.font = `500 26px ${fam}`; g.textAlign = 'right';
  g.fillText(d.from||S.me.hero||'', W-pad, Math.min(y+40, H-pad-40));
  g.textAlign = 'left'; g.font = `16px ${sans}`; g.fillStyle = p.ink; g.globalAlpha = .4;
  g.fillText(`第 ${S.week} 周 · 荣光之影`, pad, H-pad+14);
  g.globalAlpha = 1;

  cv.toBlob(b=>{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = `荣光之影_第${S.week}周.png`;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
  toast('图片已生成');
};

ACT.addIncoming = () => {
  modal('贴入对方来信', `<label class="field"><span>来信正文</span><textarea id="inbody" rows="8"></textarea></label>`,

    closeModal(); save(); render(); toast('已存入信箱');
  };
};
ACT.openLetter = el => {
  const l = S.letters.find(x=>x.id === +el.getAttribute('data-arg'));
  if(!l) return;
  const p = paperById(l.paper);
  modal(`第 ${l.week} 周 · ${l.dir==='in'?'来信':'寄出'}`,
    `<div class="${letterClasses(p)}" style="${letterStyle(p)};box-shadow:none;padding:28px 30px;font-size:15px;min-height:0">
      ${(l.kind==='news'||l.kind==='obit')?headForKind(l.kind):`<div class="lt-to">${esc(l.to||'')}：</div>`}
      <div class="lt-body">${esc(l.body)}</div><div class="lt-sign">${esc(l.from||'')}</div></div>`,

ACT.reuseLetter = el => {
  const l = S.letters.find(x=>x.id === +el.getAttribute('data-arg'));

  closeModal(); tab='write'; save(); render();
};
ACT.delLetter = el => {
  const id = +el.getAttribute('data-arg');
  S.letters = S.letters.filter(x=>x.id!==id); closeModal(); save(); render();
};
ACT.exportAll = () => {
  const t = S.letters.map(l=>`── 第${l.week}周 · ${l.dir==='in'?'来信':'寄出'} ──\n${plainLetter(l)}`).join('\n\n');

    <table class="lookup"><thead><tr><th>牌</th><th>${meta.dual?'♠ ♣ 黑色牌':'条目'}</th><th>${meta.dual?'♥ ♦ 红色牌':''}</th></tr></thead>

      <button class="btn" data-act="printDeck">打印 54 张牌面</button>

ACT.reshuffle = reshuffleAll;
let lastFree = null;
ACT.freeDraw = () => {
  const key = $('#freetable').value;
  const c = drawCard(); if(!c){ toast('牌堆空了'); return; }
  const name = TABLE_META.find(m=>m.key===key).name;
  const show = txt => { lastFree = {card:c, text:txt, table:name}; save(); render(); };
  if(c.c==='joker'){ pickFromTable(key, show); return; }
  show(lookup(key, c));
};

function pcardHTML(c){
  if(c.c==='joker') return `<div class="pcard"><div class="ix tl"><span class="r">王</span></div>
    <div class="center" style="font-size:16pt;letter-spacing:.4em">JOKER</div>
    <div class="ix br"><span class="r">王</span></div><div class="foot">荣光之影</div></div>`;
  return `<div class="pcard ${c.c==='red'?'red':''}">
    <div class="ix tl"><span class="r">${c.r}</span><span class="s">${c.s}</span></div>
    <div class="center">${c.s}</div>
    <div class="ix br"><span class="r">${c.r}</span><span class="s">${c.s}</span></div>
    <div class="foot">荣光之影</div></div>`;
}
function doPrint(html){
  $('#printarea').innerHTML = html;
  document.body.classList.add('printing');
  window.print();
  setTimeout(()=>document.body.classList.remove('printing'), 600);
}
ACT.printDeck = () => {
  const all = [];
  for(const su of SUITS) for(const r of RANKS) all.push({r, s:su.s, c:su.c});
  all.push({r:'王',s:'★',c:'joker'}, {r:'王',s:'☆',c:'joker'});
  let html = '', page = '';
  all.forEach((c,i)=>{
    page += pcardHTML(c);
    if((i+1)%9===0){ html += `<div class="psheet">${page}</div>`; page=''; }
  });
  if(page) html += `<div class="psheet">${page}</div>`;
  doPrint(html);
};
ACT.printBacks = () => {
  doPrint(`<div class="psheet">${'<div class="pcard back"></div>'.repeat(9)}</div>`);
};
ACT.printRef = () => {
  const cards = RANKS.map(r=>{
    const dl = key => {
      const m = TABLE_META.find(x=>x.key===key);
      const v = m.dual
        ? `<span class="b">${esc(m.data[r][0])}</span><span class="r">${esc(m.data[r][1])}</span>`
        : esc(m.data[r]);
      return `<dl><dt>${m.name}</dt><dd>${v}</dd></dl>`;
    };
    const ev = (tbl,name) => `<div class="ev"><div style="font-size:6.4pt;color:#8e1f28;letter-spacing:.12em">${name}：${tbl[r].t}</div>
      <ol>${tbl[r].p.map(p=>`<li>${esc(p.x)}${p.fx&&p.fx.length?` <b>${esc(p.fx.map(f=>f.label).join(' 或 '))}</b>`:''}</li>`).join('')}</ol></div>`;
    return `<div class="refcard">
      <h4>${r}<span>荣光之影 · 速查卡</span></h4>
      <div class="cols">
        ${['world','powerRule','power','front','lair','poi','mundaneGoal','superGoal','relationship','feeling','mood','starter'].map(dl).join('')}
        ${ev(T.daily,'日常事件')}
        ${ev(T.super,'超能力事件')}
      </div></div>`;
  });
  let html = '';
  for(let i=0;i<cards.length;i+=2) html += `<div style="page-break-after:always">${cards.slice(i,i+2).join('')}</div>`;
  doPrint(html);
};

ACT.exportSave = () => download(`荣光之影_存档_第${S.week}周.json`, JSON.stringify(S,null,1), 'application/json');
ACT.importSave = () => {
  const f = $('#savefile');
  f.onchange = () => {
    const file = f.files[0]; if(!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const o = JSON.parse(rd.result);
        if(!o || o.v!==1) throw 0;
        S = Object.assign(freshState(), o); save(); render(); toast('存档已载入');
      }catch(e){ toast('这个文件读不出来'); }
    };
    rd.readAsText(file);
  };
  f.click();
};
ACT.resetAll = () => {
  modal('重开一局？', '<p class="small">当前角色、信件与周志都会被清空。建议先导出存档文件。</p>',
    `<button class="btn primary" id="rsok">确认重开</button><button class="btn ghost" data-act="closemodal">取消</button>`);
  $('#rsok').onclick = () => { S = freshState(); S.deck = buildDeck(); closeModal(); tab='setup'; save(); render(); };
};

const PANELS = {setup:panelSetup, char:panelChar, turn:panelTurn, write:panelWrite,
                mail:panelMail, tables:panelTables, cards:panelCards, about:panelAbout};
function render(){
  renderNav(); renderStatus();
  for(const id of Object.keys(PANELS)){
    const el = $('#p-'+id);
    if(id === tab){ el.innerHTML = PANELS[id](); el.style.display=''; bind(el); }
    else { el.innerHTML = ''; el.style.display='none'; }
  }
}
ensureDeck();
if(!load()){ S.deck = buildDeck(); save(); }
ensureDeck();
render();
window.addEventListener('beforeunload', save);
